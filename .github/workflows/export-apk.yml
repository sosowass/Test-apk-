name: Export APK installeur valide
on:
  push:
    branches: [codex/apk-delivery]
permissions:
  contents: write
  actions: read
jobs:
  deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: sosowass/Test-apk-
          run-id: 39624907927
          name: Bilal27000diag-0.6.1-APK
          path: delivery
      - name: Publier APK valide pour installation directe
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs'), crypto = require('crypto');
            const owner = context.repo.owner, repo = context.repo.repo, branch = 'codex/design-evidence';
            const files = fs.readdirSync('delivery').filter(n => n.endsWith('.apk'));
            if (files.length !== 1) throw new Error('Expected exactly one verified APK');
            const data = fs.readFileSync('delivery/' + files[0]);
            const cp = require('child_process');
            const sdk = process.env.ANDROID_HOME + '/build-tools';
            const tools = fs.readdirSync(sdk).sort().reverse().map(v => sdk + '/' + v + '/apksigner').find(p => fs.existsSync(p));
            if (!tools) throw new Error('APK signature verifier unavailable');
            const signed = cp.execFileSync(tools, ['verify', '--verbose', '--print-certs', 'delivery/' + files[0]], {encoding: 'utf8'});
            const signer = signed.match(/Signer #1 certificate SHA-256 digest: ([a-f0-9]+)/i)[1];
            const metadata = {signer_sha256: signer, updates_0_6_0: signer === '4161cdabd5d9f4fe22b9873ba977df0f90500f23dda1d6f9ceda69e92a972664', source_sha: 'cb85a6d597107143176350b7da8efbe798d613fe', build_run: 39624907927, sha256: crypto.createHash('sha256').update(data).digest('hex'), size: data.length};
            const parent = (await github.rest.git.getRef({owner, repo, ref: 'heads/' + branch})).data.object.sha;
            const base = (await github.rest.git.getCommit({owner, repo, commit_sha: parent})).data.tree.sha;
            const blob = await github.rest.git.createBlob({owner, repo, encoding: 'base64', content: data.toString('base64')});
            const previous = (await github.rest.git.getTree({owner, repo, tree_sha: '55ab0290a611b7393d9639362e9bf6d8b2025483'})).data.tree;
            const present = new Set((await github.rest.git.getTree({owner, repo, tree_sha: base})).data.tree.map(f => f.path));
            const recovered = previous.filter(f => f.type === 'blob' && !present.has(f.path) && f.path !== 'apk-verification.json' && f.path !== 'Bilal27000diag-0.6.1.apk').map(({path, mode, type, sha}) => ({path, mode, type, sha}));
            const transfer = [];
            const encoded = data.toString('base64');
            for (let offset = 0, index = 0; offset < encoded.length; offset += 400000, index++) {
              transfer.push({path: 'transfer/apk-base64-' + index + '.txt', mode: '100644', type: 'blob', content: encoded.slice(offset, offset + 400000)});
            }
            const tree = await github.rest.git.createTree({owner, repo, base_tree: base, tree: [
              ...recovered,
              ...transfer,
              {path: 'Bilal27000diag-0.6.1.apk', mode: '100644', type: 'blob', sha: blob.data.sha},
              {path: 'apk-verification.json', mode: '100644', type: 'blob', content: JSON.stringify(metadata, null, 2)}
            ]});
            const commit = await github.rest.git.createCommit({owner, repo, message: 'Deliver verified Bilal27000diag 0.6.1 installer', tree: tree.data.sha, parents: [parent]});
            await github.rest.git.updateRef({owner, repo, ref: 'heads/' + branch, sha: commit.data.sha});
            core.info(JSON.stringify(metadata));
