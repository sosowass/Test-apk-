name: Verifier APK et compatibilite installation
on:
  push:
    branches: [codex/inspect-installation]
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39614145287
          name: Bilal27000diag-0.6.0-APK
          path: current
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39599473864
          name: Bilal27000diag-APK
          path: previous
      - name: Inspecter signatures et lien de telechargement
        shell: python
        run: |
          import os, pathlib, subprocess, json, re, hashlib, urllib.request
          sdk = pathlib.Path(os.environ['ANDROID_HOME'])
          signer = next(iter(sorted((sdk / 'build-tools').glob('*/apksigner'))), None)
          if signer is None: raise RuntimeError('Android apksigner unavailable')
          aapt = signer.with_name('aapt')
          report = {}
          for name in ('current', 'previous'):
              apk = next(pathlib.Path(name).rglob('*.apk'))
              verification = subprocess.run([str(signer), 'verify', '--verbose', '--print-certs', str(apk)], capture_output=True, text=True, check=True).stdout
              badging = subprocess.run([str(aapt), 'dump', 'badging', str(apk)], capture_output=True, text=True, check=True).stdout
              fingerprint = re.search(r'Signer #1 certificate SHA-256 digest: (.+)', verification).group(1).strip()
              package = re.search(r"package: name='([^']+)'", badging).group(1)
              minimum = re.search(r"sdkVersion:'([^']+)'", badging).group(1)
              report[name] = {'signer_sha256': fingerprint, 'package': package, 'min_sdk': minimum, 'sha256': hashlib.sha256(apk.read_bytes()).hexdigest(), 'bytes': apk.stat().st_size, 'signature_verified': True}
              print(name + ' signature: ' + fingerprint)
          report['same_package'] = report['current']['package'] == report['previous']['package']
          report['same_signer'] = report['current']['signer_sha256'] == report['previous']['signer_sha256']
          url = 'https://github.com/sosowass/Test-apk-/raw/refs/heads/codex/design-evidence/Bilal27000diag-0.6.0.apk'
          with urllib.request.urlopen(url, timeout=30) as response:
              data = response.read()
              report['download'] = {'status': response.status, 'content_type': response.headers.get('Content-Type'), 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}
          report['download_matches_tested_apk'] = report['download']['sha256'] == report['current']['sha256']
          pathlib.Path('installation-verification.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
      - name: Conserver le diagnostic
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner, repo = context.repo.repo, branch = 'codex/design-evidence';
            const parent = (await github.rest.git.getRef({owner, repo, ref: 'heads/' + branch})).data.object.sha;
            const base = (await github.rest.git.getCommit({owner, repo, commit_sha: parent})).data.tree.sha;
            const tree = await github.rest.git.createTree({owner, repo, base_tree: base, tree: [{path: 'installation-verification.json', mode: '100644', type: 'blob', content: fs.readFileSync('installation-verification.json', 'utf8')}]});
            const commit = await github.rest.git.createCommit({owner, repo, message: 'Record APK signature and installation diagnostics', tree: tree.data.sha, parents: [parent]});
            await github.rest.git.updateRef({owner, repo, ref: 'heads/' + branch, sha: commit.data.sha});
