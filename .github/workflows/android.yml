name: Bilal27000diag APK et verification visuelle
on:
  push:
    branches: [main, codex/premium-automobile]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compiler APK, tests et lint
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug 2>&1 | tee build-log.txt
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verifier les cinq ecrans sur Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p screenshots
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            gradle --no-daemon --console=plain :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.profile=phone
            adb pull /sdcard/Android/data/com.mostadiag.app/files/screenshots/. screenshots/
            adb shell wm size 640x1136
            adb shell wm density 320
            gradle --no-daemon --console=plain :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.profile=compact
            adb pull /sdcard/Android/data/com.mostadiag.app/files/screenshots/. screenshots/
            adb shell wm size 1600x2560
            adb shell wm density 320
            gradle --no-daemon --console=plain :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.profile=tablet
            adb pull /sdcard/Android/data/com.mostadiag.app/files/screenshots/. screenshots/
            adb shell wm size 1080x1920
            adb shell wm density 420
            adb shell settings put system font_scale 1.5
            gradle --no-daemon --console=plain :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.profile=large_text
            adb pull /sdcard/Android/data/com.mostadiag.app/files/screenshots/. screenshots/
      - name: Collecter les erreurs Android
        if: failure()
        run: adb logcat -d > android-logcat.txt || true
      - name: Publier les preuves visuelles et rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bilal27000diag-verification
          path: |
            build-log.txt
            android-logcat.txt
            screenshots/
            app/build/reports/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
      - name: Publier APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Bilal27000diag-0.6.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
