name: Bilal27000diag APK et verification visuelle
on:
  push:
    branches: [main, codex/premium-automobile]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compiler APK, tests et lint
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug 2>&1 | tee build-log.txt
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verifier les cinq ecrans sur Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/verify-emulator.sh
      - name: Collecter les erreurs Android
        if: failure()
        run: |
          cat app/build/reports/lint-results-debug.txt || true
          timeout 10s adb logcat -d > android-logcat.txt || true
      - name: Publier les preuves visuelles et rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bilal27000diag-verification
          path: |
            build-log.txt
            instrumentation-*.txt
            android-logcat.txt
            screenshots/
            app/build/reports/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
      - name: Publier APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Bilal27000diag-0.6.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enregistrer les captures consultables
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('screenshots') || fs.readdirSync('screenshots').length === 0) return;
            const owner = context.repo.owner, repo = context.repo.repo;
            const branch = 'codex/design-evidence';
            let parent = null;
            try { parent = (await github.rest.git.getRef({owner, repo, ref: 'heads/' + branch})).data.object.sha; }
            catch (e) { if (e.status !== 404) throw e; }
            const tree = [];
            for (const name of fs.readdirSync('screenshots').filter(n => n.endsWith('.webp'))) {
              const blob = await github.rest.git.createBlob({owner, repo, content: fs.readFileSync('screenshots/' + name).toString('base64'), encoding: 'base64'});
              tree.push({path: name, mode: '100644', type: 'blob', sha: blob.data.sha});
            }
            const manifest = JSON.stringify({source_sha: context.sha, run_url: `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`, screenshots: tree.map(f => f.path)}, null, 2);
            tree.push({path: 'verification.json', mode: '100644', type: 'blob', content: manifest});
            const created = await github.rest.git.createTree({owner, repo, tree});
            const commit = await github.rest.git.createCommit({owner, repo, message: 'Android emulator screenshots for ' + context.sha, tree: created.data.sha, parents: parent ? [parent] : []});
            if (parent) await github.rest.git.updateRef({owner, repo, ref: 'heads/' + branch, sha: commit.data.sha});
            else await github.rest.git.createRef({owner, repo, ref: 'refs/heads/' + branch, sha: commit.data.sha});
