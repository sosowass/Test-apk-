name: O31 TV V4 - Direct APK CDN
on:
  push:
    branches: [o31-hotel-v4]
    paths:
      - '.github/workflows/o31-direct-download.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-direct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download verified released APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/o31apk
          gh release download o31-hotel-tv-v4 --repo "${{ github.repository }}" --pattern 'O31-Hotel-TV-V4.apk' --dir /tmp/o31apk
          test "$(stat -c%s /tmp/o31apk/O31-Hotel-TV-V4.apk)" -gt 9000000
          unzip -t /tmp/o31apk/O31-Hotel-TV-V4.apk | tail -2
          sha256sum /tmp/o31apk/O31-Hotel-TV-V4.apk
      - name: Publish static APK branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/o31cdn
          cp /tmp/o31apk/O31-Hotel-TV-V4.apk /tmp/o31cdn/O31-Hotel-TV-V4.apk
          cd /tmp/o31cdn
          git init -q
          git checkout -qb o31-v4-direct-download
          git config user.email "o31-build@users.noreply.github.com"
          git config user.name "O31 APK delivery bot"
          git add O31-Hotel-TV-V4.apk
          git commit -qm "Publish verified O31 TV V4 APK for direct URL"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push -f origin HEAD:refs/heads/o31-v4-direct-download
      - name: Verify direct CDN and raw HTTPS delivery
        shell: bash
        run: |
          set -uo pipefail
          cdn="https://cdn.jsdelivr.net/gh/${{ github.repository }}@o31-v4-direct-download/O31-Hotel-TV-V4.apk"
          raw="https://raw.githubusercontent.com/${{ github.repository }}/o31-v4-direct-download/O31-Hotel-TV-V4.apk"
          echo "CDN_URL=$cdn"
          echo "RAW_URL=$raw"
          for i in $(seq 1 8); do
            echo "Check attempt $i"
            code=$(curl --retry 1 -L -sS --max-time 30 -o /dev/null -w '%{http_code}' -r 0-1023 "$cdn" || true)
            echo "CDN_HTTP=$code"
            [[ "$code" = "200" || "$code" = "206" ]] && break
            sleep 8
          done
          echo "RAW_HEADERS:"
          curl -fsSI --max-time 25 "$raw" | grep -Ei 'HTTP/|content-type:|content-length:|content-disposition:' || true
          echo "CDN_HEADERS:"
          curl -fsSI --max-time 25 "$cdn" | grep -Ei 'HTTP/|content-type:|content-length:|content-disposition:' || true
      - name: Create easy short link for TV if possible
        run: |
          set -u
          target="https://cdn.jsdelivr.net/gh/${{ github.repository }}@o31-v4-direct-download/O31-Hotel-TV-V4.apk"
          short=$(curl -sSfL -G --max-time 25 --data-urlencode 'format=simple' --data-urlencode "url=$target" 'https://is.gd/create.php' || true)
          echo "SHORT_URL=$short"
          if [[ "$short" == https://is.gd/* ]]; then
            curl -sIL --max-time 25 -o /dev/null -w 'SHORT_HTTP=%{http_code}\n' "$short" || true
          fi
