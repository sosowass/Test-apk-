name: O31 V5 - Verify Agenda and Direct Downloader CDN
on:
  push:
    branches: [o31-hotel-v5]
    paths: ['.github/workflows/o31-v5-direct-download.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify OpenAgenda public feed used in V5
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.parse,urllib.request,json,datetime
          date=datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          where=f'location_city = "Toulouse" AND lastdate_end >= "{date}"'
          base='https://public.opendatasoft.com/api/explore/v2.1/catalog/datasets/evenements-publics-openagenda/records'
          q=urllib.parse.urlencode(dict(where=where,order_by='firstdate_begin ASC',limit=4,offset=0))
          url=base+'?'+q
          print('OpenAgenda query:',url,flush=True)
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'O31HotelTV/5'}),timeout=25) as r:payload=json.load(r)
          rows=payload.get('results',[])
          print('AGENDA LIVE total_count=',payload.get('total_count'),'first_batch=',len(rows),flush=True)
          for e in rows[:3]:
              print('EVENT:',repr(e.get('title')),'city',repr(e.get('location_city')),'from',repr(e.get('firstdate_begin')),'until',repr(e.get('lastdate_end')))
          assert isinstance(rows,list) and len(rows)>0 and payload.get('total_count',0)>0, 'No live Toulouse events'
          PY
      - name: Fetch V5 compiled APK and validate ZIP
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/o31apk
          gh release download o31-hotel-tv-v5 --repo "\${{ github.repository }}" --pattern 'O31-Hotel-TV-V5.apk' --dir /tmp/o31apk
          test "$(stat -c%s /tmp/o31apk/O31-Hotel-TV-V5.apk)" -gt 9000000
          unzip -t /tmp/o31apk/O31-Hotel-TV-V5.apk | tail -2
          sha256sum /tmp/o31apk/O31-Hotel-TV-V5.apk
      - name: Publish direct binary for Downloader
        env:
          GH_TOKEN: \${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/o31cdn
          cp /tmp/o31apk/O31-Hotel-TV-V5.apk /tmp/o31cdn/O31-Hotel-TV-V5.apk
          cd /tmp/o31cdn
          git init -q
          git checkout -qb o31-v5-direct-download
          git config user.email "o31-build@users.noreply.github.com"
          git config user.name "O31 APK delivery bot"
          git add O31-Hotel-TV-V5.apk
          git commit -qm "Publish verified O31 TV V5 APK"
          git remote add origin "https://x-access-token:\${GH_TOKEN}@github.com/\${{ github.repository }}.git"
          git push -f origin HEAD:refs/heads/o31-v5-direct-download
      - name: Verify CDN binary with real HTTP requests
        shell: bash
        run: |
          set -uo pipefail
          cdn="https://cdn.jsdelivr.net/gh/\${{ github.repository }}@o31-v5-direct-download/O31-Hotel-TV-V5.apk"
          raw="https://raw.githubusercontent.com/\${{ github.repository }}/o31-v5-direct-download/O31-Hotel-TV-V5.apk"
          echo "V5_CDN=$cdn"
          echo "V5_RAW=$raw"
          for i in 1 2 3 4 5; do
            code=$(curl -sSL --max-time 25 -o /dev/null -w '%{http_code}' -r 0-1023 "$cdn" || true)
            echo "V5_CDN_HTTP=$code"
            [[ "$code" = "206" || "$code" = "200" ]] && break
            sleep 5
          done
          curl -sSI --max-time 25 "$cdn" | grep -Ei 'HTTP/|content-type:|content-length:' || true
          curl -sSI --max-time 25 "$raw" | grep -Ei 'HTTP/|content-type:|content-length:' || true
      - name: Short Downloader address
        run: |
          target="https://cdn.jsdelivr.net/gh/\${{ github.repository }}@o31-v5-direct-download/O31-Hotel-TV-V5.apk"
          short=$(curl -fsSL -G --max-time 20 --data-urlencode 'format=simple' --data-urlencode "url=$target" https://is.gd/create.php || true)
          echo "V5_SHORT=$short"
          [[ "$short" == https://is.gd/* ]] && curl -sSIL --max-time 20 -o /dev/null -w 'V5_SHORT_HTTP=%{http_code}\n' "$short" || true
